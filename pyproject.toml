[project]
name = "vopak-mcp"
version = "2.0.0"
description = "Google Workspace + GCP MCP servers for AI agents — Slides, Docs, Sheets, Drive, Cloud Run, IAM, Storage, Logging, and more"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastmcp>=2.0.0",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "markupsafe>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
