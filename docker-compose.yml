# =============================================================================
# Vopak Workspace MCP Server — Docker Compose
# =============================================================================
# Usage:
#   docker compose up -d --build
#
# The container idles and Antigravity invokes tools via:
#   docker exec -i vopak-workspace-mcp /app/server --server slides
# =============================================================================

services:
  workspace-mcp:
    build: .
    container_name: vopak-workspace-mcp
    restart: unless-stopped
    environment:
      TEMPLATE_FOLDER_ID: "1DcCliXLB4qp8jOStQKPS4iCJUHPE8Lxm"
    volumes:
      # Mount Google Cloud ADC credentials (read-only)
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
