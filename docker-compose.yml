services:
  workspace-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vopak-mcp
    restart: unless-stopped
    volumes:
      # Persistent named volumes for credentials (survive container rebuilds)
      - gws_credentials:/root/.config/gws
      - gcloud_credentials:/root/.config/gcloud
      # Bind mount host Projects folder for local file uploads (read-only)
      - ${HOME}/Projects:/projects:ro
    environment:
      - GOOGLE_WORKSPACE_CLI_KEYRING_BACKEND=file
      - GWS_BINARY_PATH=/usr/local/bin/gws

volumes:
  gws_credentials:
  gcloud_credentials:
